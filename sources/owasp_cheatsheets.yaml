id: owasp_cheatsheets
name: "OWASP Cheat Sheet Series"
site_no: "17a"
home: "https://cheatsheetseries.owasp.org/"
mode: index
status: active
iteration: 5
fetch:
  method: git_sparse
  url: "https://github.com/OWASP/CheatSheetSeries"
  checksum_url: null
refresh: "P7D"
langs: [en]
kind_default: document
stable_id: page_anchor
check: "index_lookup"
license:
  class: cc_by_sa
  url: "https://cheatsheetseries.owasp.org/"
  checked_at: 2026-10-14
snippet_policy: short
attribution: "OWASP, CC BY-SA 4.0"
rate_limit: { rps: null, daily: null }
guards: { max_row_drop: 0.2 }
golden:
  - { query: "Cross Site Scripting Prevention", expect: "Cross_Site_Scripting_Prevention_Cheat_Sheet" }
  - { query: "output encoding", expect: "Cross_Site_Scripting_Prevention_Cheat_Sheet#output-encoding" }
contact: null
notes: "cheatsheets/*.md. Each cheat sheet is a document; `##` sections are spec_section entries with anchors generated by Python-Markdown's toc rule (as in MkDocs). Headings appearing in at least three cheat sheets (such as Introduction and References), and headings longer than six words, are excluded. DEPRECATED / (Historical) → deprecated, without sections; `Please visit [X](X.md)` → replaced_by."
