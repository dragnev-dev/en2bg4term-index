id: nist_dads
name: "NIST Dictionary of Algorithms and Data Structures"
site_no: "13"
home: "https://xlinux.nist.gov/dads/"
mode: index
status: active
iteration: 5
fetch:
  method: html_page
  url: "https://xlinux.nist.gov/dads/"
  checksum_url: null
refresh: "P30D"
langs: [en]
kind_default: term
stable_id: page_path
check: "index_lookup"
license:
  class: public_domain
  url: "https://xlinux.nist.gov/dads/Other/creditNotice.html"
  checked_at: 2026-10-14
snippet_policy: short
attribution: "NIST DADS"
rate_limit: { rps: 0.2, daily: null }
guards: { max_row_drop: 0.2 }
golden:
  - { query: "abstract data type", expect: "abstractDataType" }
  - { query: "DAG", expect: "directAcycGraph" }
contact: null
notes: "The home page (fetch.url) contains the full alphabetical index: title → URL; `X: see Y` → redirect label. Definitions (1,100+ pages) are not fetched: at 0.2 requests per second, a refresh would take over an hour, so there are effectively no snippets. If definitions are added, omit snippets for entries marked `CRC Press` or carrying another copyright notice."
